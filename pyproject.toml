[project]
name = "python-test"
version = "1.0.0"
description = "Materiały dydaktyczne do kursu testowania programów w Pythonie 3"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.md" }
dependencies = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.8",
    "behave>=1.2.6",
    "selenium>=4.20",
    "pytest-html>=4.1",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
markers = [
    "slow: testy wolniejsze (mozna pominac przez -m 'not slow')",
    "selenium: testy wymagajace uruchomienia przegladarki",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/examples/*", "*/diagrams/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

