<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Catalog</title></head>
<body>
  <header>
    <h1>Catalog</h1>
    <p role="status" aria-live="polite">Cart: <span id="cart-count">0</span> items</p>
  </header>
  <section id="products" aria-label="Products">
    <article class="product" data-sku="book-1"><h2>Python Testing</h2><button class="add">Add</button></article>
    <article class="product" data-sku="book-2"><h2>BDD in Practice</h2><button class="add">Add</button></article>
  </section>
  <script>
    let cartCount = 0;
    document.querySelectorAll("article.product button.add").forEach(function(button) {
      button.addEventListener("click", function() {
        cartCount += 1;
        document.getElementById("cart-count").textContent = String(cartCount);
      });
    });
  </script>
</body>
</html>
