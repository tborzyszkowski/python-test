<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
  <title id="title">Architecture fitness function</title>
  <desc id="desc">Automatyczna reguła architektury sprawdza zdrowy i celowo błędny graf, potwierdza detekcję naruszenia i działa przed integracją zmian.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#59738d"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#17324d" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1000" height="410" rx="26" fill="url(#bg)"/>
  <text x="500" y="52" fill="#17324d" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="middle">Architektura pod ciągłą kontrolą</text>

  <g filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <rect x="44" y="119" width="190" height="108" rx="18" fill="#e2efff" stroke="#5b91cc" stroke-width="2"/>
    <text x="139" y="159" fill="#285985" font-size="19" font-weight="700">REGUŁA</text>
    <text x="139" y="190" fill="#3c4b5a" font-size="14">np. domain nie importuje</text>
    <text x="139" y="210" fill="#3c4b5a" font-size="14">adapterów</text>

    <rect x="280" y="119" width="190" height="108" rx="18" fill="#ede7ff" stroke="#9273cb" stroke-width="2"/>
    <text x="375" y="159" fill="#5b418e" font-size="19" font-weight="700">FITNESS TEST</text>
    <text x="375" y="190" fill="#494255" font-size="14">pytest-archon /</text>
    <text x="375" y="210" fill="#494255" font-size="14">Import Linter / AST</text>

    <rect x="516" y="90" width="190" height="86" rx="18" fill="#dcf5e8" stroke="#47a775" stroke-width="2"/>
    <text x="611" y="126" fill="#236743" font-size="18" font-weight="700">ZDROWY GRAF</text>
    <text x="611" y="151" fill="#354941" font-size="14">kontrakt przechodzi</text>

    <rect x="516" y="211" width="190" height="86" rx="18" fill="#fee2e2" stroke="#e35d5b" stroke-width="2"/>
    <text x="611" y="247" fill="#9f2f32" font-size="18" font-weight="700">ZNANY BŁĄD</text>
    <text x="611" y="272" fill="#493b42" font-size="14">detektor wykrywa cykl</text>

    <rect x="752" y="119" width="204" height="108" rx="18" fill="#fff1d6" stroke="#e6a739" stroke-width="2"/>
    <text x="854" y="159" fill="#81520b" font-size="19" font-weight="700">CI GATE</text>
    <text x="854" y="190" fill="#4c4a43" font-size="14">wynik blokuje merge</text>
    <text x="854" y="210" fill="#4c4a43" font-size="14">lub wymaga poprawki</text>
  </g>

  <g fill="none" stroke="#59738d" stroke-width="3" marker-end="url(#arrow)">
    <path d="M239 173 H270"/>
    <path d="M475 173 H498"/>
    <path d="M711 133 C728 133 730 155 742 159"/>
    <path d="M711 254 C728 254 730 196 742 188"/>
  </g>
  <text x="500" y="352" fill="#52677b" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle">Sprawdź zarówno przypadek poprawny, jak i kontrolowane naruszenie — inaczej test może być zawsze zielony.</text>
</svg>
