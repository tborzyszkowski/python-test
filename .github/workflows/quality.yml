name: Python quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest src -q

      - name: Run BDD scenarios
        run: python -m behave src/04-BDD/04-passenger-flights/features -f progress

      - name: Run architecture contracts
        working-directory: src/06-ArchTest/03-architecture-rules
        env:
          PYTHONPATH: ${{ github.workspace }}/src/06-ArchTest/03-architecture-rules/src
        run: lint-imports --config .importlinter

      - name: Run Ruff
        run: python -m ruff check src
